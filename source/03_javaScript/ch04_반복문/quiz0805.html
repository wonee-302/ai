<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <style>
    
  </style>
  <script>
    var totalCount = 0;
    var totalScore = 0; 
    var wrongInput = 0; 
    var rightInput = 0;

    while(confirm('누적할래?')){
      totalCount ++;
      let scoreStr = prompt('누적할 점수?');
      let score = Number(scoreStr);

      if (scoreStr && scoreStr.trim() && !isNaN(score) && (0<= score <=100)){
        totalScore += score; 
        rightInput++;
      }else{ 
        wrongInput++; 
      }
    }
    document.write(`${totalCount}번 입력<br>`);
    document.write(`누적점수: ${totalScore}<br>`);
    document.write(`점수를 제대로 입력한 횟수:  ${rightInput} <br>`);
    document.write(`점수를 잘못 입력한 횟수:  ${wrongInput} <br>`);

  </script>


    
  </script>
</head>
<body>
  
</body>
</html>
