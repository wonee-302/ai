     div {border:1px solid gray;}
        #header, #footer { /* id선택자*/

            /*text-decoration:underline;*/
        }
        #wrap {
            width: 600px;
            margin: 0 auto;
            background-color: aqua;
            overflow: hidden; /*부모단에*/
            text-align:center;/* 가운데 정렬(글씨, 이미지) */

        #wrap #content{
                float: left;/*블록형태그를 수평으로  350*/
                width:348px;/*content가로 = width(348px) +border(1px*2) =350 */
                height:300px;
            }
        #wrap #content .odd { /*class 선택자(. ) */

                font-size:1.5em;/*원래크기에 1.5배*/
        }

        #wrap #content .menu2{font-weight:bold;}

        #wrap #side_banner {
                float: left; /*블록형태그를 수평으로 250*/
                width: 248px; /*content가로 = width(248px) +border(1px*2) =250 */
                height: 300px;
            }
        #wrap #side_banner img {width:240px;}
        #footer {
            clear:both;
        }
    </style>
