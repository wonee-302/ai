<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        footer p {
            margin: 0;
            color: gray;
            font-size: 10pt;
        }
        p {
            text-align: center;
        }
        span {
            color: red;
            font-weight: bold;
        }
    </style>
    <script>
    function chk() {
        if (frm.id.value.trim().length < 4) {
            alert('아이디는 4글자 이상입니다. ');
            frm.id.focus();
            return false;
        } else if (frm.pw.value.length < 4) {
            alert('비밀번호는 4자리 이상 필수입력입니다.');
            frm.pw.focus();
            return false;
        } else if (frm.pw.value != frm.pwChk.value) {
            alert('비밀번호를 확인하세요');
            frm.pw.value = '';
            frm.pwChk.value = '';
            frm.pw.focus();
            return false; //submit 제한
        }
        return true;
    }


    </script>
</head>
<body>
    <header>
        <h1> 회원가입</h1>

    </header>


    <section>
        <fieldset>
            <legend>필수입력</legend>
            <form name="frm" onsubmit="return chk()>

                <table>
                    <tr>

                        <td><label for="id"></label>이름<span>*</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
                        <td> <input type="text" name="id" id="id" placeholder="이름은 2글자이상" required="required"   autocomplete="off"</td>
                    </tr>
                    <br />
                    <tr>
                        <td> 아이디<span>*</span>&nbsp;&nbsp;&nbsp;</td>&nbsp;
                        <td>
                            <input type="hidden" name="data" value="숨겨서보냄" />
                            <input type="text" name="id" size="20" placeholder="ID는 4글자이상"  required="required" autocomplete="off" />
                            
                        </td>
                    </tr><br /> 
                    <tr>
                        <td> <label for="pw"> 비밀번호<span>*</span></label></td>
                        <td> <input type="password" name=" pw" required="required" /></td>


                    </tr>
                    <br />
                    <tr>
                        <td>
                            <label for="pwChk">비번확인<span>*</span></label>
                        </td>
                        <td> <input type="password" name="pwChk" id="pwChk"  required="required"</td>

                    </tr>
                    <br />
                    <tr>
                        <td>
                            <label for="tel"> 전화<span>*</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;</label>
                            <input type="text" name="tel" id="tel" placeholder="xx-xxx-xxxx/000-0000-0000"
                                   required="required"
                                   autocomplete="off"
                                   pattern="\d{2,3}-?\d{3,4}-?\d{4}"
                                   title="전화번호패턴을 지켜주세요" />
                        </td>
                        <br />
                        <td>
                            <label for=" =email">이메일<span>*</span>&nbsp;&nbsp;&nbsp;&nbsp;</label>
                            <input type="text" name="email" id="email" required="required"placeholder="id@domain.com 또는 co.kr"
                                   pattern="[a-z0-9_]+@\w+(\.\w+){1,2}"
                                   title="이메일 패턴을 지켜주세요" />
                        </td>
                    </tr>


                </table>
                </p>
            </form>
        </fieldset>
       
        <form action=" " method="get">
            <fieldset>
                <legend>추가입력사항</legend>
                <tr>
                    <td> 결혼유 무</td>
                    <td>
                        <input type="radio" name="marial status" value="married" checked="checked" /> 기혼
                        <input type="radio" name="marial status" value="single" /> 미혼
                    </td>
                </tr><br />
                <tr>
                    <td> 자식</td>
                    <td>
                        <input type="checkbox" name="child" value="son" checked="checked" />아들
                        <input type="checkbox" name="child" value="daughter" />딸
                    </td>
                </tr><br />
                <tr>
                    <td> 지역</td>
                    <td>
                        <select name="region">
                            <option>충정</option>
                            <option> 경기</option>
                            <option selected="selected"> 서울</option>
                            <option> 제주</option>
                        </select>
                    </td>
                </tr>

            </fieldset>
            <tr>
                <th colspan="2">
                    <p> <input type="submit" value="가입" />
                   
                        <input type="reset" value="취소"/>
                    </p>

                </th>

            </tr>
        </form>


    </section>
    <hr >
    <footer>
        <p> 서울시 서대문구 신촌로 141 은하빌딩 203호 </p>
        <p> Copyright ⓒ XX All rights reserved</p>

    </footer>
</body>
</html>
