<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table {
            background-color: red; 
           
        }

        tr {
            background-color: yellow; 
        }
        tr:hover {
            background-color: lightgreen; 
        }
        caption {
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <table>
        <caption> Table ex1</caption>
        <tr>
            <td> <b>국어 </b></td>
            <td> <b>영어</b> </td>
            <td> <b>수학 </b></td>

        </tr>
        <tr>
            <td> 100 </td>
            <td> 60 </td>
            <td> 80 </td>
        </tr>

    </table>
    <table>
        <caption> Table ex2</caption>
        <tr>
            <td> <b>국어 </b></td>
            <td> <b>영어</b> </td>
            <td> <b>수학 </b></td>

        </tr>
        <tr>
            <td> 100 </td>
            <td> 60 </td>
            <td> 80 </td>
        </tr>
        <tr>
            <th colspan="2"><b>평균</b> </th>
            <td> 80 </td>
        </tr>

    </table>
    <table>
        <caption> Table ex3</caption>

        <tr>
            <th rowspan="3"> <b>중간고사성적</b> </th>
            <td> <b>국어 </b></td>
            <td> <b>영어</b> </td>
            <td> <b>수학 </b></td>

        </tr>
        <tr>


            <td> 100 </td>
            <td> 60 </td>
            <td> 80 </td>

        </tr>
        <tr>
          
            <th colspan="2"> <b>평균</b> </th>
            <td> 80 </td>
 
        </tr>
     
       
     
    </table>

</body>
</html>
